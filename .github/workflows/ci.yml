# Push em main -> build no GitHub Actions -> SSH na VPS -> git fetch + rebuild.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Vite
        run: npm run build

      - name: Verify dist output
        run: |
          test -f dist/index.html || { echo "ERRO: dist/index.html nao foi gerado"; exit 1; }
          echo "Build OK. Conteudo de dist/:"
          ls -la dist/

  docker:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image (sanity check)
        run: docker build -f Dockerfile -t sucessoes-web:ci .

  deploy:
    runs-on: ubuntu-latest
    needs: [build, docker]
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -euo pipefail
            cd /var/www/rb-landing-patrimonio
            git remote set-url origin https://github.com/matheusqueiroz92/rb-landing-patrimonio.git
            git fetch origin main
            git reset --hard origin/main
            cp /var/www/rb-landing-patrimonio/docker-compose.yml /opt/apps/rb-landing-patrimonio/docker-compose.yml
            cd /opt/apps/rb-landing-patrimonio
            docker compose build --no-cache web
            docker compose up -d --force-recreate web
            docker image prune -f
